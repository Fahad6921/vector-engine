name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo run --release -p vecengine-storage --example crash_test -- 200

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install ./crates/py pytest
      - run: pytest -q crates/py/tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vecengine .
      - run: docker run -d --name ve -p 8080:8080 vecengine
      - name: smoke test
        run: |
          for i in $(seq 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -X PUT localhost:8080/collections/demo -H 'content-type: application/json' \
            -d '{"dim": 3, "metric": "l2"}'
          curl -sf -X PUT localhost:8080/collections/demo/points -H 'content-type: application/json' \
            -d '{"points": [{"id": 1, "vector": [0, 0, 0]}, {"id": 2, "vector": [1, 1, 1]}]}'
          curl -sf -X POST localhost:8080/collections/demo/search -H 'content-type: application/json' \
            -d '{"vector": [0.9, 0.9, 0.9], "k": 1}' | tee /dev/stderr | grep -q '"id":2'
      - if: failure()
        run: docker logs ve
