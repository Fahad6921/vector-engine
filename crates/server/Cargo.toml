[package]
name = "vecengine-server"
description = "HTTP server for vector-engine collections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
vecengine = { path = "../core" }
vecengine-storage = { path = "../storage" }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
