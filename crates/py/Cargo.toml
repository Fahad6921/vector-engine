[package]
name = "vecengine-py"
description = "Python bindings for vector-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vecengine"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.30.0"
pyo3 = { version = "0.30", features = ["extension-module"] }
vecengine = { path = "../core" }
