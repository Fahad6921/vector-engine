[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "vecengine"
description = "Vector search engine written from scratch in Rust"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
